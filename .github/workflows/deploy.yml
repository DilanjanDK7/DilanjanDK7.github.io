name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
          # If package-lock.json exists in site/, use it; else cache is skipped

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Inject Firebase web configuration
        working-directory: site
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -z "$FIREBASE_WEB_CONFIG" ]; then
            echo "Missing FIREBASE_WEB_CONFIG repository secret."
            exit 1
          fi
          printf '%s' "$FIREBASE_WEB_CONFIG" > public/assets/js/firebase-config.js

      - name: Inject Cloudflare Turnstile site key
        working-directory: site
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          printf "window.TURNSTILE_SITE_KEY = '%s';\n" "$TURNSTILE_SITE_KEY" > public/assets/js/turnstile-config.js

      - name: Build
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
